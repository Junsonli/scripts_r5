// Session-only authoring controls. The launcher backs up settings.cfg first.
sv_cheats 1
rfd_enabled 0
rfd_editor_enabled 1
bind_US_standard "3" "+scriptCommand6" 0
bind_US_standard "4" "+scriptCommand1" 0
bind_US_standard "5" "+scriptCommand2" 0
bind_US_standard "6" "+scriptCommand3" 0
bind_US_standard "b" "+scriptCommand5" 0
bind_US_standard "z" "+scriptCommand4" 0
bind_US_standard "F5" "rfd_ed_save" 0
bind_US_standard "F9" "exec rfd_editor_saves/latest.cfg" 0
bind_US_standard "F6" "rfd_mark A" 0
bind_US_standard "F7" "rfd_mark B" 0
bind_US_standard "F8" "rfd_mark C" 0
bind_US_standard "F11" "rfd_mark D" 0
bind_US_standard "f" "noclip" 0
